[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "politicker-ref"
version = "0.1.0"
description = "Reference implementation of the measurement core of POLITICKER: codebook-driven coding of text units, versioned codebook snapshots, and the theoretical accommodation review."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.5", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
politicker-ref = "politicker_ref.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
